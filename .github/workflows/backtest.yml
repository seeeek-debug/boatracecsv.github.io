name: Boat Prediction Backtest

on:
  workflow_dispatch: # GitHubの画面から手動でも実行できるようにする
  schedule:
    - cron: '0 23 * * *' # 毎日日本時間の朝8時（UTC 23:00）に自動実行

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy

      - name: Run backtest script
        run: |
          python main.py

