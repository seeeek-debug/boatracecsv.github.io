name: Train Boatrace ML Model

on:
  schedule:
    - cron: '0 18 * * 1' # 毎週月曜の深夜に自動実行（必要に応じて変更可）
  workflow_dispatch: # GitHubのActionsタブから手動でも実行可能

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy lightgbm scikit-learn joblib requests

      - name: Run training script
        run: |
          python train.py

      - name: Save trained model back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add boatrace_lgb_model.pkl
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update trained ML model [skip ci]" && git push)
