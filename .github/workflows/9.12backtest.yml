name: Run Backtest

on:
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests joblib

      - name: Run Backtest Script
        run: |
          python backtest_0912.py

