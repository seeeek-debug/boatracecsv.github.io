name: Fetch Realtime Odds

on:
  schedule:
    # 5分おきに自動実行
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run odds fetcher script
        run: |
          PYTHONPATH=scripts python scripts/run_odds_fetcher.py

      - name: Commit and push updated odds
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/previews/
          git commit -m "Auto-update realtime odds (od2 & od3)" || exit 0
          git push

