name: Run Sui Preview Fetcher

on:
  schedule:
    # JST 08:00 ~ 21:59 (UTC 23:00 ~ 12:59)
    - cron: '*/8 23,0-12 * * *'
    # JST 22:00 ~ 22:30 (UTC 13:00 ~ 13:30)
    - cron: '0,8,16,24,30 13 * * *'
  workflow_dispatch:

jobs:
  run-sui-fetcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 numpy scikit-learn

      - name: Run sui fetcher
        run: |
          python scripts/run_sui_fetcher.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/previews/sui/
          if git diff --staged --quiet; then
            echo "nothing to commit, working tree clean"
          else
            git commit -m "Auto update daily sui weather preview data [skip ci]"
            git push
          fi

