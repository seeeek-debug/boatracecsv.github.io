name: Run odds fetcher
run: PYTHONPATH=. python scripts/run_odds_fetcher.py


on:
  schedule:
    # JST 8:00 〜 22:30 の間、5分ごとに実行 (UTC 23:00〜13:30)
    - cron: '*/5 23,0-12 * * *'
    - cron: '0-30/5 13 * * *'
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run odds fetcher
        run: |
          python scripts/run_odds_fetcher.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "Auto update real-time odds data" && git push)
