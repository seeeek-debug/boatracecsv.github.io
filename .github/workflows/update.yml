import glob
import os
import itertools
import numpy as np
import pandas as pd

def load_csvs_safely(pattern):
    files = glob.glob(pattern, recursive=True)
    if not files:
        return pd.DataFrame()
    return pd.concat([pd.read_csv(f, low_memory=False) for f in files], ignore_index=True)

def main():
    print("全データを読み込んでいます...")
    df_programs = load_csvs_safely('data/programs/**/*.csv')
    df_previews = load_csvs_safely('data/previews/**/*.csv')
    df_estimates = load_csvs_safely('data/estimates/**/*.csv')
    df_results = load_csvs_safely('data/results/**/*.csv')

    if not df_programs.empty:
        base_df = df_programs.copy()
        print(f"programs データ読み込み成功: {len(base_df)} 行")
    elif not df_results.empty:
        base_df = df_results.copy()
        print(f"results データ読み込み成功: {len(base_df)} 行")
    else:
        print("有効なベースデータ（programs や results）が見つかりませんでした。")
        return

    sanrentan_results = []
    
    if not base_df.empty and 'race_code' in base_df.columns and 'waku' in base_df.columns:
        for df_sub in [df_previews, df_estimates, df_results]:
            if not df_sub.empty and 'race_code' in df_sub.columns and 'waku' in df_sub.columns:
                cols_to_use = df_sub.columns.difference(base_df.columns).tolist() + ['race_code', 'waku']
                base_df = pd.merge(base_df, df_sub[list(set(cols_to_use))], on=['race_code', 'waku'], how='left')

        numeric_cols = base_df.select_dtypes(include=[np.number]).columns.tolist()
        score_candidates = ['motor_2ren', 'racer_win_rate', 'st_average', 'index', 'score']
        used_score_col = next((col for col in score_candidates if col in numeric_cols), None)
        
        if used_score_col:
            print(f"スコア算出にカラム '{used_score_col}' を使用します。")
            base_df['pred_score'] = base_df[used_score_col].fillna(0)
        else:
            print("適切なスコア用数値カラムが見つからないため、一律のスコアを使用します。")
            base_df['pred_score'] = 0.5

        for race_code, group in base_df.groupby('race_code'):
            group = group.drop_duplicates(subset=['waku'])
            if len(group) < 6:
                continue

            boats = group['waku'].values
            scores = group['pred_score'].values
            exp_scores = np.exp(scores - np.max(scores))
            if np.sum(exp_scores) == 0:
                continue
            boat_probs = dict(zip(boats, exp_scores / np.sum(exp_scores)))

            race_preds = []
            for p1, p2, p3 in itertools.permutations(boats, 3):
                p_1st = boat_probs.get(p1, 0)
                rem_1 = 1.0 - p_1st
                if rem_1 <= 0: continue
                p_2nd = boat_probs.get(p2, 0) / rem_1
                rem_2 = rem_1 - boat_probs.get(p2, 0)
                if rem_2 <= 0: continue
                p_3rd = boat_probs.get(p3, 0) / rem_2

                race_preds.append({
                    'race_code': race_code,
                    'combination': f'{int(p1)}-{int(p2)}-{int(p3)}',
                    'probability': p_1st * p_2nd * p_3rd
                })

            if race_preds:
                race_preds = sorted(race_preds, key=lambda x: x['probability'], reverse=True)
                sanrentan_results.extend(race_preds[:5])

    os.makedirs('data/predictions', exist_ok=True)
    if sanrentan_results:
        df_pred_out = pd.DataFrame(sanrentan_results)
        df_pred_out.to_csv('data/predictions/latest_predictions.csv', index=False)
        print(f'予測完了: data/predictions/latest_predictions.csv に {len(df_pred_out)} 件の予測を出力しました。')
    else:
        print('条件を満たす有効なレースデータ（6艇揃ったレースなど）が現在存在しないため、予測ファイルは生成されませんでした。')

if __name__ == '__main__':
    main()
