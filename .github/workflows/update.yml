name: Boatrace Auto Update

on:
  schedule:
    # 2分おきに実行する設定（※GitHubのcronは数分程度の遅延が発生する場合があります）
    - cron: '*/2 * * * *'
  workflow_dispatch: # Actionsタブから手動実行できるようにする

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット権限を付与
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run update script
        run: |
          # 実行したいスクリプトを指定（例としてリアルタイム更新スクリプト）
          python scripts/preview-realtime.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add data/
          git diff --staged --quiet || git commit -m "Auto update data: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

