name: Boatrace Auto Update & Predict

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  update-and-predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install lightgbm scikit-learn

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git config --global pull.rebase false

      - name: Run data update script
        continue-on-error: true
        run: |
          python scripts/preview-realtime.py

      - name: Run prediction script
        run: |
          python scripts/train_and_predict.py

      - name: Commit and push changes
        run: |
          git add data/
          git diff --staged --quiet || git commit -m "Auto update data and predictions: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
