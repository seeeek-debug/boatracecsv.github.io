name: Boatrace Auto Update & Predict

on:
  schedule:
    - cron: '*/2 * * * *' # 2分おきに実行
  workflow_dispatch: # Actionsタブから手動でも実行可能

jobs:
  update-and-predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの自動コミット権限を付与
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install lightgbm scikit-learn

      - name: Run data update script
        run: |
          # 1. ボートレースの最新データを取得・更新
          python scripts/preview-realtime.py

      - name: Run prediction script
        run: |
          # 2. 全データを結合してLightGBMで予測・買い目を計算
          python scripts/train_and_predict.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add data/
          git diff --staged --quiet || git commit -m "Auto update data and predictions: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
