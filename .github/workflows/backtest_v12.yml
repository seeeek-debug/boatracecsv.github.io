name: V12 Backtest Simulation

on:
  workflow_dispatch:  # GitHubのActionsタブから手動で実行できるようにする

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          # 必要に応じて pip install -r requirements.txt や poetry install を追加

      - name: Execute Backtest Script
        run: |
          python scripts/boatrace/predictors/run_backtest_v12.py

