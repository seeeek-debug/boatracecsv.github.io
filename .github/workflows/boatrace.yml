name: Boatrace Daily Notification

on:
  schedule:
    # 毎日日本時間 08:30 (UTC 23:30) に実行
    - cron: '30 23 * * *'
  workflow_dispatch: # GitHub画面から手動実行したい時用

jobs:
  run-screening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests pytz

      - name: Run bot script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python boatrace_bot.py
