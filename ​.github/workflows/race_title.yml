name: Fetch Race Titles Daily

on:
  schedule:
    # UTC 23:00 ＝ JST（日本時間）朝 8:00
    - cron: '0 23 * * *'
  workflow_dispatch: # GitHubの画面から手動実行も可能にする

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run race title script
        run: python scripts/race-title.py --force --no-push

      - name: Commit and push updated CSV
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update race title data [skip ci]"
          file_pattern: "data/programs/title/*"

